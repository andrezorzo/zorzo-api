[project]
name = "rag-core"
version = "0.1.0"
description = "Generic core: services, ports and adapters"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6",
    "sqlalchemy[asyncio]>=2.0.30",
    "psycopg[binary]>=3.2",
    "structlog>=24",
    "numpy>=2.5.5",
    "pgvector>=0.5.1",
    "langchain-ollama>=1.2.0",
    "langchain-text-splitters>=1.2.0",
    "fastembed>=0.9.1",
    "anyio>=4.16.0",
    "phonenumbers==9.0.42",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_core"]

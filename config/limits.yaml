# Rule values (LLD "Values and configuration"): a flat mapping, validated at startup. Each task adds its own.
max_question_chars: 500
max_body_bytes: 8192
ping_interval: 10  # seconds
request_deadline: 20  # seconds, whole request
retrieval_top_k: 20
rrf_k: 60
rerank_top_n: 6
degraded_max_passages: 6
chunk_tokens: 400
chunk_overlap: 0.15
search_min_similarity: 0.5  # cosine; a vector hit below it doesn't count (calibrated at M3)
rate_ip_burst: 10
rate_ip_window: 600  # seconds; the burst window of both the IP and the session buckets
rate_ip_daily: 40  # per UTC day
rate_session_burst: 10
rate_session_daily: 40  # per UTC day
timeout_turnstile: 3  # seconds; Cloudflare sets no value
timeout_route: 3  # seconds per model call of the stage; assess and reformulate use it too
timeout_rerank: 2.5  # the remote rerank of 20 candidates took 1.0 to 2.0 s (measured 2026-11-25)
timeout_answer: 12
timeout_judge: 5
daily_budget_usd: 0.10  # paid spend per UTC day
budget_paid_cutoff: 0.8  # share of the day's budget at which paid entries stop
request_cost_cap_usd: 0.01
breaker_cooldown: 60  # seconds a free entry cools down when the provider sends no Retry-After (LiteLLM)
alert_repeat_after: 43200  # seconds (12 h)
retention_public_traces: 2592000  # seconds (30 days); stamped on a trace as its expires_at
answer_reserve: 12  # seconds left before `answer` starts, or the run goes search-only
max_reformulate: 1
max_repair: 1
recursion_limit: 12  # LangGraph backstop; reaching it is a bug
context_max_tokens: 2500  # passages in a prompt
guard_threshold: 0.5  # the L2 classifier's malicious probability at which a question is blocked (calibrated at M3)
# relevance_floor and assess_skip_score: off until calibrated at M3 (LLD "6.3 Agent run")

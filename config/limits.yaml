# Rule values (LLD "Values and configuration"): a flat mapping, validated at startup. Each task adds its own.
max_question_chars: 500
max_body_bytes: 8192
ping_interval: 10  # seconds
request_deadline: 20  # seconds, whole request
retrieval_top_k: 20
rrf_k: 60
rerank_top_n: 6
degraded_max_passages: 6
chunk_tokens: 400
chunk_overlap: 0.15
search_min_similarity: 0.5  # cosine; a vector hit below it doesn't count (calibrated at M3)
rate_ip_burst: 10
rate_ip_window: 600  # seconds; the burst window of both the IP and the session buckets
rate_ip_daily: 40  # per UTC day
rate_session_burst: 10
rate_session_daily: 40  # per UTC day
timeout_turnstile: 3  # seconds; Cloudflare sets no value

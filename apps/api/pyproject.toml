[project]
name = "zorzo-api-app"
version = "0.1.0"
description = "FastAPI app: HTTP routes, SSE, gate"
requires-python = ">=3.13,<3.14"
dependencies = ["zorzo-core", "fastapi>=0.115", "uvicorn[standard]>=0.30"]

[tool.uv.sources]
zorzo-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zorzo_api"]

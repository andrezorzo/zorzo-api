[project]
name = "rag-dashboard"
version = "0.1.0"
description = "Django: public dashboard pages and the schema owner"
requires-python = ">=3.13,<3.14"
dependencies = ["django>=5.2,<6", "dj-database-url>=2.2", "psycopg[binary]>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_dashboard", "data"]

[project]
name = "zorzo-ingest"
version = "0.1.0"
description = "One-shot job: runs the core ingest pipeline for a domain"
requires-python = ">=3.13,<3.14"
dependencies = ["zorzo-core"]

[tool.uv.sources]
zorzo-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zorzo_ingest"]

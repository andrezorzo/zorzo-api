# Local stack. Credentials come from infra/.env (copy infra/.env.example); none are hardcoded here.
name: zorzo

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: zorzo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: zorzo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zorzo -d zorzo"]
      interval: 2s
      timeout: 3s
      retries: 30

  dashboard:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: dashboard
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql://zorzo:${POSTGRES_PASSWORD}@postgres:5432/zorzo
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "apps/dashboard/manage.py", "migrate", "--noinput"]

  ollama:
    image: ollama/ollama:0.40.17
    environment:
      OLLAMA_KEEP_ALIVE: "-1"  # the model stays loaded (LLD "Environment variables")
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    # First run: docker compose -f infra/compose.yaml exec ollama ollama pull bge-m3:567m

  ingest:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: ingest
    profiles: ["ingest"]  # one-shot: docker compose -f infra/compose.yaml run --rm ingest --activate
    environment:
      APP_ENV: local
      DOMAIN: zorzo
      DATABASE_URL: postgresql://zorzo:${POSTGRES_PASSWORD}@postgres:5432/zorzo
      OLLAMA_URL: http://ollama:11434
      DATA_DIR: /data
    volumes:
      - sitedata:/data
    depends_on:
      dashboard:
        condition: service_completed_successfully
      ollama:
        condition: service_started

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: api
    environment:
      APP_ENV: local
      DOMAIN: zorzo
      DATABASE_URL: postgresql://zorzo:${POSTGRES_PASSWORD}@postgres:5432/zorzo
      OLLAMA_URL: http://ollama:11434
      # Turnstile's always-pass test secret (LLD "Development environment"); the real one is production-only.
      TURNSTILE_SECRET: 1x0000000000000000000000000000000AA
      SALT_SEED: ${SALT_SEED:?set SALT_SEED in infra/.env}
      # The local models config (Ollama, no key); APP_ENV=local picks it too, this makes it explicit.
      MODELS_FILE: config/models.local.yaml
      # Only needed when MODELS_FILE points at a config with OpenRouter entries.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # The API binds to 127.0.0.1 by default. To reach it from the host through the port below,
      # set HOST to 0.0.0.0 here (owner's decision).
    depends_on:
      dashboard:
        condition: service_completed_successfully
      ollama:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
  ollama:
  sitedata:

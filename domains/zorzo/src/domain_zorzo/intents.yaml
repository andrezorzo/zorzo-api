# The intents `route` classifies a question into (LLD "6.3 Agent run"). `description`: what the route prompt
# is told the intent covers (its `$intents` slot). `kinds`: the document kinds the intent's retrieval reads
# (all when absent). `action`: `answer` (default, the RAG path), `decline` (no answer call) or `contact`
# (no answer call: the reply is the domain's contact options).
career_fact:
  description: salary or rates, availability, visa or work authorization, time zone or working hours
  kinds: [faq]
about_andre:
  description: his career, experience, skills, employers, education
about_system:
  description: how this site or its AI agent works, its design, code or decisions
projects_live:
  description: what he is working on now, or a specific project of his
contact:
  description: how to reach or hire him
  action: contact
off_topic:
  description: >-
    anything else (general-purpose requests, other people, his personal life, opinions about former
    employers or colleagues)
  action: decline

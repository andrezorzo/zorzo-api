    url: https://www.linkedin.com/in/andrezorzo
  - label: GitHub
    url: https://github.com/andrezorzo
  - label: Email
    url: mailto:andre_zorzo@yahoo.com
# The hosts an answer's claim may link to (a subdomain counts); a claim with any other link is removed.
link_hosts: [zorzo.dev.br, github.com, linkedin.com]
